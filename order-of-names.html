<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta content="0; url=gv-order-of-tongues.html" http-equiv="refresh"/><title>Order of Tongues — Grimmvein</title><style>
/* Reliable body-level keyword tooltip. The older ::after tooltip remains as a no-JS fallback. */
.js-tooltips .keyword-tip[data-tooltip]::after,
.js-tooltips .keyword-tip[data-tooltip]::before { content:none !important; display:none !important; }
.keyword-tip[data-tooltip] { cursor:help; text-decoration:underline dotted rgba(240,213,128,.55); text-underline-offset:2px; }
.gv-keyword-tooltip {
  position:fixed; z-index:2147483000; left:0; top:0;
  width:min(430px,calc(100vw - 24px));
  padding:12px 14px; color:#f1e7d5; background:#090b0c;
  border:1px solid var(--gold-bright); box-shadow:0 10px 36px rgba(0,0,0,.72);
  font-family:"Times New Roman",Times,serif; font-size:1rem; line-height:1.4;
  text-align:left; white-space:normal; pointer-events:none;
  opacity:0; visibility:hidden; transition:opacity .08s ease;
}
.gv-keyword-tooltip.is-visible { opacity:1; visibility:visible; }
.gv-keyword-tooltip strong { display:block; margin-bottom:4px; color:var(--gold-bright); font-weight:700; }
</style></head><body><p><a href="order-of-tongues.html">Continue to Order of Tongues</a></p><script>
(() => {
  const triggers = [...document.querySelectorAll('.keyword-tip[data-tooltip]')];
  if (!triggers.length) return;
  document.body.classList.add('js-tooltips');

  const tip = document.createElement('div');
  tip.className = 'gv-keyword-tooltip';
  tip.setAttribute('role', 'tooltip');
  tip.setAttribute('aria-hidden', 'true');
  tip.innerHTML = '<strong></strong><span></span>';
  document.body.appendChild(tip);
  const tipName = tip.querySelector('strong');
  const tipText = tip.querySelector('span');
  let active = null;

  const position = (el) => {
    if (!el || !tip.classList.contains('is-visible')) return;
    const r = el.getBoundingClientRect();
    const pad = 12;
    const gap = 9;
    tip.style.left = '0px';
    tip.style.top = '0px';
    const t = tip.getBoundingClientRect();
    let left = r.left + r.width / 2 - t.width / 2;
    left = Math.max(pad, Math.min(left, window.innerWidth - t.width - pad));
    let top = r.top - t.height - gap;
    if (top < pad) top = r.bottom + gap;
    if (top + t.height > window.innerHeight - pad) top = Math.max(pad, window.innerHeight - t.height - pad);
    tip.style.left = `${Math.round(left)}px`;
    tip.style.top = `${Math.round(top)}px`;
  };

  const show = (el) => {
    active = el;
    const keyword = (el.dataset.keyword || el.textContent || '').trim();
    tipName.textContent = keyword;
    tipText.textContent = el.dataset.tooltip || '';
    tip.classList.add('is-visible');
    tip.setAttribute('aria-hidden', 'false');
    position(el);
  };
  const hide = (el) => {
    if (el && active !== el) return;
    active = null;
    tip.classList.remove('is-visible');
    tip.setAttribute('aria-hidden', 'true');
  };

  triggers.forEach(el => {
    el.setAttribute('aria-describedby', '');
    el.addEventListener('mouseenter', () => show(el));
    el.addEventListener('mouseleave', () => hide(el));
    el.addEventListener('focus', () => show(el));
    el.addEventListener('blur', () => hide(el));
    el.addEventListener('click', e => {
      if (!window.matchMedia('(hover: none)').matches) return;
      e.stopPropagation();
      if (active === el && tip.classList.contains('is-visible')) hide(el); else show(el);
    });
  });
  document.addEventListener('click', e => { if (!e.target.closest('.keyword-tip[data-tooltip]')) hide(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
  window.addEventListener('resize', () => active && position(active));
  window.addEventListener('scroll', () => active && position(active), true);
})();
</script></body></html>
